name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest (24.04) bazı Buildozer paketlerini (libtinfo5 vb.) bulamıyor;
    # 22.04 sabitlemek bu hatayı kökten engeller.
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Python bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Buildozer önbelleği
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Spec dosyasını kontrol et
        run: |
          ls -la
          test -f main.py || (echo "main.py bulunamadı!" && exit 1)
          test -f buildozer.spec || (echo "buildozer.spec bulunamadı!" && exit 1)

      - name: APK derle
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ucguard-apk
          path: bin/*.apk

      - name: Hata olursa logu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            .buildozer/android/platform/build-*/build/other_builds/*/*/*.log
          if-no-files-found: ignore
